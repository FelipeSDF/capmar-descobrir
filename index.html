<title>CapMar - Descobrir</title>

<style>
:root{--background:#f6f1e7;--surface:#fffdf8;--surface-2:#faf5ea;--foreground:#14262e;--muted:#55666c;--line:#ddd3bf;--line-soft:#eae2d0;--primary:#1b4fa8;--primary-strong:#143c82;--primary-soft:#e4ebf7;--secondary:#0e2f3c;--accent:#c4492a;--accent-strong:#a43a1e;--sun:#f2b33d;--danger:#b3261e;--like:#1f6b4a;--success-soft:#e0f0e7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--background);color:var(--foreground);font-family:Figtree,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;background:none;border:0;color:inherit}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
.h{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;color:var(--secondary)}
main{margin:0 auto;display:flex;flex-direction:column;min-height:100dvh;width:100%;max-width:560px;padding:16px 16px 32px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:inline-flex;align-items:center;gap:8px;min-height:44px}
.brand span{font-size:18px}
.count{font-size:14px;font-weight:600;color:var(--muted)}
.bar{margin-top:12px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>div{height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.stage{position:relative;margin:16px 0;min-height:420px;flex:1}
.card{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;border-radius:24px;border:1px solid var(--line);background:var(--surface);box-shadow:0 18px 40px -22px rgba(14,47,60,.45);touch-action:none;user-select:none;-webkit-user-select:none;transition:transform 240ms cubic-bezier(.2,.7,.3,1)}
.card.back{transform:scale(.94) translateY(14px);pointer-events:none;z-index:1}
.card.front{z-index:2;cursor:grab}
.cover{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;width:100%}
.cover .ini{position:relative;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:96px;line-height:1;opacity:.9}
.tiles{position:absolute;inset:0;opacity:.18;background-size:56px 56px}
.stamp{z-index:2;position:absolute;top:20px;padding:4px 12px;border:4px solid;border-radius:12px;background:rgba(255,255,255,.85);font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:24px}
.stamp.like{left:20px;transform:rotate(-12deg);color:var(--like);border-color:var(--like);opacity:clamp(0,var(--p,0),1)}
.stamp.pass{right:20px;transform:rotate(12deg);color:var(--danger);border-color:var(--danger);opacity:clamp(0,calc(var(--p,0) * -1),1)}
.hint{z-index:2;position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center}
.hint span{display:inline-flex;align-items:center;gap:4px;border-radius:99px;background:rgba(14,47,60,.7);color:#fff;padding:4px 12px;font-size:12px;font-weight:600}
.info{display:flex;align-items:center;gap:14px;padding:16px 20px 20px}
.logo{display:block;width:52px;height:52px;flex-shrink:0;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px -6px rgba(14,47,60,.5)}
.logo svg{display:block;width:100%;height:100%}
.cover.photo{background:var(--surface-2)}
.cover.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cover.photo::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(to top,rgba(14,47,60,.35),transparent);pointer-events:none}
.cat{font-size:13px;font-weight:600;color:var(--primary)}
.name{font-size:26px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.actions{display:grid;grid-template-columns:repeat(4,1fr);align-items:start;gap:8px;padding:0 4px}
.round{display:flex;flex-direction:column;align-items:center;gap:6px}
.round button{display:grid;place-items:center;border-radius:50%;border:2px solid;transition:transform .15s}
.round button:active{transform:scale(.95)}
.round button:disabled{opacity:.4}
.round small{font-size:12px;font-weight:600;color:var(--muted)}
.tip{margin-top:16px;text-align:center;font-size:13px;color:var(--muted)}
.panel{border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.btn{display:inline-flex;min-height:44px;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 18px;color:var(--primary-strong);font-size:15px;font-weight:650}
.btn:active{transform:translateY(1px) scale(.985)}
.btn:disabled{opacity:.5}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.like{background:var(--like);border-color:var(--like);color:#fff}
.badge{display:inline-flex;align-items:center;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-soft);padding:3px 9px;color:#435358;font-size:13px;font-weight:650}
.badge.pub{background:var(--success-soft);border-color:#bcdcc9;color:#17543a}
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(14,47,60,.55)}
.sheet{display:flex;flex-direction:column;width:100%;max-width:560px;max-height:88dvh;overflow:hidden;border-radius:24px 24px 0 0;background:var(--surface);animation:up .28s cubic-bezier(.16,1,.3,1)}
@media(min-width:640px){.overlay{align-items:center;padding:24px}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:12px 20px}
.sheet-b{flex:1;min-height:0;overflow-y:auto;padding:16px 20px}
.sheet-f{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding:12px 20px}
.x{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;flex-shrink:0}
.kw{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tut{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(14,47,60,.7);padding:20px}
.tut>div,.tut>form{width:100%;max-width:384px;border-radius:24px;background:var(--surface);padding:24px;animation:up .28s cubic-bezier(.16,1,.3,1)}
.tut ul{margin-top:16px;display:grid;gap:12px;font-size:15px}
.note{margin-top:16px;border-radius:12px;background:var(--surface-2);padding:12px;font-size:13px;color:var(--muted)}
.end{display:grid;gap:20px;padding-bottom:24px;margin-top:24px;animation:up .28s cubic-bezier(.16,1,.3,1)}
.row{display:flex;min-height:44px;align-items:center;justify-content:space-between;gap:12px;border-radius:12px;padding:0 8px;font-size:15px;font-weight:600;color:var(--secondary)}
.rank{display:flex;min-height:48px;align-items:center;gap:12px;padding:0 8px}
.rank i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface-2);font:800 13px "Bricolage Grotesque",system-ui;font-style:normal;color:var(--secondary)}
.rank i.top{background:var(--sun)}
.rank b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;color:var(--secondary)}
.rank em{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;font-style:normal;color:var(--accent-strong)}
.demo{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 10px;z-index:40;white-space:nowrap}
</style>
</head>

const API="https://script.google.com/macros/s/AKfycbyEqkz5dASQtGKt60qlVo2rjHd8ljWYrQ2Nu5-u0IZp98_J_eWFzh6AwUVpcLlEoQL6/exec";
const uuid=()=>crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let SID=ls.get("capmar_discover_session");if(!SID||!/^[0-9a-f-]{36}$/.test(SID)){SID=uuid();ls.set("capmar_discover_session",SID)}
let Q=[];try{Q=JSON.parse(ls.get("capmar_discover_queue")||"[]")}catch(e){Q=[]}
let NOME=(ls.get("capmar_discover_nome")||"").trim();
let sending=false,timer=null,fails=0;
const device=()=>({language:(navigator.language||"").slice(0,16),viewport_w:innerWidth,viewport_h:innerHeight,touch:"ontouchstart" in window||navigator.maxTouchPoints>0,ua:navigator.userAgent.slice(0,160),source:new URLSearchParams(location.search).get("e")||undefined});
function track(type,data){Q.push(Object.assign({id:uuid(),type,ts:Date.now()},data||{}));ls.set("capmar_discover_queue",JSON.stringify(Q.slice(-2000)));if(type==="like"||type==="dislike"||type==="undo")flush();else sched(1500)}
function sched(ms){if(timer)return;timer=setTimeout(()=>{timer=null;flush()},ms)}
async function flush(keepalive){if(sending||(!Q.length&&!NOME))return;sending=true;const batch=Q.slice(0,100);
 try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({session_id:SID,nome:NOME,device:device(),events:batch}),keepalive:!!keepalive,redirect:"follow"});
  const j=await r.json();if(!j.ok&&j.erro!=="json invalido"&&j.erro!=="sessao invalida")throw new Error(j.erro);
  Q=Q.slice(batch.length);ls.set("capmar_discover_queue",JSON.stringify(Q));fails=0}
 catch(e){fails++;sched(Math.min(30000,1500*2**fails))}
 finally{sending=false}
 if(Q.length&&!fails)flush(keepalive)}
async function fetchRanking(){const r=await fetch(API+"?acao=ranking&t="+Date.now());const j=await r.json();if(!j.ok)throw new Error("ranking");return j}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){track("page_hidden");flush(true)}else track("page_visible")});
addEventListener("online",()=>{fails=0;flush()});
track("session_start",{meta:{path:location.pathname}});

 {id:6,name:"Mumbuca Delivery",category:"Tecnologia",owner:"Larissa Oliveira",support:false,kw:["app","comércio local","mumbuca"],desc:"Aplicativo de entrega que aceita a moeda Mumbuca e só trabalha com comércio de Maricá. Já são 35 lojas no piloto em Inoã e no Centro."},
 {id:7,name:"Ateliê Azulejo Vivo",category:"Artesanato",owner:"Cláudia Ribeiro",support:true,kw:["cerâmica","arte","oficinas"],desc:"Azulejos pintados à mão com temas de Maricá: capivaras, lagoas e a Pedra do Elefante. Fazemos oficinas abertas na praça uma vez por mês."},
 {id:8,name:"Abelhas da Restinga",category:"Meio ambiente",owner:"Marcos Vieira",support:true,kw:["abelhas nativas","mel","polinização"],desc:"Meliponário com abelhas nativas sem ferrão (jataí, mandaçaia e uruçu) no Espraiado. Produzimos mel e levamos caixas para escolas e hortas, para que as abelhas ajudem a polinizar a cidade."},
 {id:9,name:"Bolo de Banana da Vó Dita",category:"Alimentação",owner:"Edite Gonçalves",support:false,kw:["bolos","receita de família","feira"],desc:"Bolo de banana caseiro, sem glúten, servido com iogurte e frutas vermelhas, numa receita de quatro gerações. Vendemos na feira de Itaipuaçu e queremos abrir um cantinho no Centro."},
 {id:10,name:"Cine Lagoa ao Ar Livre",category:"Cultura",owner:"Pedro Henrique Alves",support:true,kw:["cinema","cultura","comunidade"],desc:"Sessões de cinema gratuitas em praças e na beira da lagoa, com filmes nacionais e curtas de realizadores de Maricá. Uma sessão por mês em bairros diferentes."}
];
const BASE_LIKES={1:14,2:11,3:8,4:12,5:16,6:9,7:10,8:13,9:7,10:15};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let tutSeen=false;try{tutSeen=localStorage.getItem("capmar_demo_tut")==="1"}catch(e){}
let RANK=null,RANK_LOADING=false,shownAt=performance.now();
const S={cards:shuffle(PROJECTS.slice()),remaining:[],votes:{},history:[],detail:null,tutorial:!tutSeen||NOME.length<2,busy:false};
S.remaining=S.cards.slice();
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const app=document.getElementById("app");
function cover(c){const ph=PHOTOS[c.id];if(ph)return `<div class="cover photo"><img src="${ph.src}" alt="Foto do projeto ${esc(c.name)}" draggable="false">`;const k=COVERS[hash(c.category||c.name)%COVERS.length];const t=TILES[c.id%TILES.length];
 return `<div class="cover" style="background:${k.bg};color:${k.fg}"><div class="tiles" style="background-image:${t}"></div><span class="ini">${esc(c.name.charAt(0))}</span>`}
function cardHTML(c,front){return `<article class="card ${front?"front":"back"}" ${front?`id="front"`:`aria-hidden="true"`}>${cover(c)}<span class="stamp like">CURTI</span><span class="stamp pass">PASSO</span>${front?`<span class="hint"><span>${I.down(14)}Toque para ver mais</span></span>`:""}</div><div class="info"><span class="logo">${LOGOS[c.id]||""}</span><div style="min-width:0">${c.category?`<p class="cat">${esc(c.category)}</p>`:""}<h2 class="h name">${esc(c.name)}</h2></div></div></article>`}
function roundBtn(a,label,size,style,icon){return `<div class="round"><button data-a="${a}" aria-label="${label}" style="width:${size}px;height:${size}px;${style}">${icon}</button><small>${label}</small></div>`}
function render(){
 const total=S.cards.length,done=total-S.remaining.length,finished=S.remaining.length===0;
 const likes=Object.values(S.votes).filter(v=>v==="like").length;
 let h=`<header><a class="brand" href="#" data-a="noop">${LOGO}<span class="h">Descobrir</span></a><p class="count">${Math.min(done+(finished?0:1),total)} de ${total}</p></header><div class="bar"><div style="width:${done/total*100}%"></div></div>`;
 if(finished)h+=endHTML();
 else{
  const two=S.remaining.slice(0,2);
  h+=`<div class="stage" id="stage">${two.slice().reverse().map(c=>cardHTML(c,c===two[0])).join("")}</div><div class="actions">`
   +roundBtn("undo","Desfazer",48,"margin-top:8px;border-color:var(--line);background:var(--surface);color:var(--secondary)"+(S.history.length?"":";opacity:.4"),I.undo(20))
   +roundBtn("dislike","Passar",60,"border-color:var(--danger);background:var(--surface);color:var(--danger)",I.x(30))
   +roundBtn("detail","Detalhes",48,"margin-top:8px;border-color:var(--line);background:var(--surface);color:var(--primary)",I.info(22))
   +roundBtn("like","Curtir",60,"border-color:var(--like);background:var(--like);color:#fff",I.heart(28))
   +`</div><p class="tip">Arraste para a direita para curtir e para a esquerda para passar.</p><p class="tip" style="margin-top:4px">${likes} curtidas até agora</p>`;
 }
 if(S.detail)h+=detailHTML(S.detail);
 if(S.tutorial)h+=`<div class="tut"><form role="dialog" aria-modal="true" id="tutform" autocomplete="on"><h2 class="h" style="font-size:24px">Qual é o seu nome?</h2><input id="nome" name="name" autocomplete="name" enterkeyhint="go" maxlength="80" placeholder="Seu nome" value="${esc(NOME)}" style="margin-top:12px;width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;font-size:16px;color:var(--foreground);background:var(--surface)"><h3 class="h" style="font-size:18px;margin-top:20px">Como funciona</h3><ul><li><strong style="color:var(--like)">Arraste para a direita</strong> para curtir.</li><li><strong style="color:var(--danger)">Arraste para a esquerda</strong> para passar.</li><li><strong>Toque no cartão</strong> ou role para baixo para ver os detalhes.</li></ul><p class="note">Para a pesquisa do evento, registramos seu nome e o que você faz aqui (votos, tempo e tipo de aparelho). Não pedimos contato.</p><button type="submit" id="tutbtn" class="btn primary" style="margin-top:20px;width:100%" ${NOME.length<2?"disabled":""}>Começar</button></form></div>`;
 app.innerHTML=h;bindDrag();
 const f=document.getElementById("tutform");if(f){const i=document.getElementById("nome"),b=document.getElementById("tutbtn");i.addEventListener("input",()=>{b.disabled=i.value.trim().length<2});f.addEventListener("submit",e=>{e.preventDefault();seeTut();flush()});if(!NOME)setTimeout(()=>i.focus(),300)}
}
function detailHTML(d){return `<div class="overlay" data-a="close"><div class="sheet" role="dialog" aria-modal="true" data-a="stay"><div class="sheet-h"><span class="logo" style="width:48px;height:48px">${LOGOS[d.id]||""}</span><div style="min-width:0;flex:1">${d.category?`<p class="cat">${esc(d.category)}</p>`:""}<h2 class="h" style="font-size:24px;line-height:1.15">${esc(d.name)}</h2></div><button class="x" data-a="close" aria-label="Fechar detalhes">${I.x(22)}</button></div><div class="sheet-b"><div style="height:220px;border-radius:16px;overflow:hidden;display:flex">${cover(d)}</div></div>${PHOTOS[d.id]?`<p style="margin:6px 0 16px;font-size:12px;color:var(--muted)">Foto: <a href="${PHOTOS[d.id].page}" target="_blank" rel="noopener" style="text-decoration:underline">${esc(PHOTOS[d.id].credit)}</a> (imagem ilustrativa)</p>`:`<div style="height:16px"></div>`}<p style="font-size:14px;color:var(--muted)">Por <strong style="color:var(--secondary)">${esc(d.owner)}</strong></p><p style="margin-top:12px;font-size:16px;line-height:1.6">${esc(d.desc)}</p><ul class="kw">${d.kw.map(k=>`<li class="badge">${esc(k)}</li>`).join("")}</ul>${d.support?`<p style="margin-top:16px"><span class="badge pub">Aceita apoio</span></p>`:""}<a class="btn" style="margin-top:20px" href="#" data-a="noop">Ver página completa${I.out(16)}</a></div><div class="sheet-f"><button class="btn danger" data-a="dislike">${I.x(18)}Passar</button><button class="btn like" data-a="like">${I.heart(18)}Curtir</button></div></div></div>`}
function endHTML(){
 const liked=S.cards.filter(c=>S.votes[c.id]==="like"),passed=S.cards.filter(c=>S.votes[c.id]==="dislike").length;
 if(!RANK&&!RANK_LOADING){RANK_LOADING=true;track("deck_end",{value:S.cards.length,meta:{likes:liked.length}});setTimeout(()=>flush(),50);setTimeout(()=>fetchRanking().then(r=>{RANK=r;track("ranking_view")}).catch(()=>{RANK={people:0,items:[],fail:true}}).finally(()=>{RANK_LOADING=false;if(!S.remaining.length)render()}),900)}
 const byId=Object.fromEntries(PROJECTS.map(p=>[p.id,p.name]));
 const rank=RANK&&!RANK.fail?RANK.items.filter(r=>byId[r.project_id]&&r.likes>0).slice(0,5).map(r=>({name:byId[r.project_id],likes:r.likes})):[];
 return `<div class="end"><div class="panel" style="padding:24px;text-align:center"><p class="h" style="font-size:36px">Acabou!</p><p style="margin-top:8px;color:var(--muted)">Você avaliou ${liked.length+passed} projetos: <strong style="color:var(--secondary)">${liked.length} curtidas</strong> e ${passed} passes.</p></div>`
 +(liked.length?`<section class="panel" style="padding:20px"><h2 class="h" style="font-size:18px">Projetos que você curtiu</h2><ul style="margin-top:8px">${liked.map(c=>`<li><a class="row" href="#" data-a="noop"><span>${esc(c.name)}</span><span style="color:var(--primary)">${I.out(16)}</span></a></li>`).join("")}</ul></section>`:"")
 +`<section class="panel" style="padding:20px"><h2 class="h" style="font-size:18px;display:flex;align-items:center;gap:8px"><span style="color:var(--accent);display:flex">${I.heart(18)}</span>Mais curtidos do evento</h2>${RANK===null?`<p style="margin-top:12px;font-size:14px;color:var(--muted)">Carregando ranking…</p>`:RANK.fail?`<p style="margin-top:12px;font-size:14px;color:var(--muted)">Não foi possível carregar o ranking agora.</p>`:!rank.length?`<p style="margin-top:12px;font-size:14px;color:var(--muted)">O ranking aparece assim que houver curtidas.</p>`:""}<ol style="margin-top:8px">${rank.map((r,i)=>`<li class="rank"><i class="${i===0?"top":""}">${i+1}</i><b>${esc(r.name)}</b><em>${I.heart(14)}${r.likes}</em></li>`).join("")}</ol>${RANK&&!RANK.fail?`<p style="margin-top:12px;padding:0 8px;font-size:13px;color:var(--muted)">${RANK.people} ${RANK.people===1?"pessoa já votou":"pessoas já votaram"}.</p>`:""}</section>`
 +`<div class="panel" style="display:grid;gap:12px;padding:20px"><p style="font-size:15px;color:var(--secondary)"><strong>Seu projeto também pode estar aqui.</strong> Crie uma conta e apresente o que você faz.</p><a class="btn primary" href="#" data-a="noop">Criar minha conta${I.out(18)}</a><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><button class="btn" data-a="restart">${I.undo(16)}Rever tudo</button><a class="btn" href="#" data-a="noop">Ver vitrine</a></div></div></div>`;
}
function vote(choice){
 const c=S.remaining[0];if(!c||S.busy||S.tutorial)return;S.busy=true;
 track(choice,{project_id:c.id,method:S.detail?"details":(window.__m||"button"),position:S.cards.indexOf(c),dwell_ms:Math.round(performance.now()-shownAt)});window.__m=null;
 S.votes[c.id]=choice;S.history.push({card:c,choice});
 if(S.detail){S.detail=null;render()}
 const finish=()=>{S.remaining.shift();S.busy=false;shownAt=performance.now();if(S.remaining[0])track("card_view",{project_id:S.remaining[0].id,position:S.cards.indexOf(S.remaining[0])});render()};
 const n=document.getElementById("front");
 if(n&&!reduced){const dir=choice==="like"?1:-1;n.style.setProperty("--p",dir);n.style.transition="transform 280ms cubic-bezier(.2,.7,.3,1),opacity 280ms ease-out";n.style.transform=`translate3d(${dir*innerWidth*1.1}px,-30px,0) rotate(${dir*20}deg)`;n.style.opacity="0";setTimeout(finish,280)}else finish();
}
function undo(){if(S.busy||!S.history.length||S.tutorial)return;const last=S.history.pop();track("undo",{project_id:last.card.id,method:"button",meta:{previous:last.choice}});RANK=null;delete S.votes[last.card.id];S.remaining.unshift(last.card);render()}
function openDetail(){if(!S.remaining[0]||S.busy||S.detail||S.tutorial)return;S.detail=S.remaining[0];track("details_open",{project_id:S.detail.id,position:S.cards.indexOf(S.detail)});render()}
function seeTut(){const v=(document.getElementById("nome")||{}).value||"";NOME=v.replace(/\s+/g," ").trim().slice(0,80);if(NOME.length<2)return;ls.set("capmar_discover_nome",NOME);track("tutorial_dismiss");shownAt=performance.now();try{localStorage.setItem("capmar_demo_tut","1")}catch(err){}S.tutorial=false;render()}
app.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a==="noop"){e.preventDefault();return}
 if(a==="stay")return;
 if(a==="close"){S.detail=null;render()}
 else if(a==="like"||a==="dislike")vote(a);
 else if(a==="undo")undo();
 else if(a==="detail")openDetail();
 else if(a==="tut")seeTut();
 else if(a==="restart"){S.history=[];S.votes={};S.cards=shuffle(PROJECTS.slice());S.remaining=S.cards.slice();RANK=null;render()}
});
addEventListener("keydown",e=>{
 if(e.key==="Escape"&&S.detail){S.detail=null;render();return}
 if(S.tutorial)return;
 if(e.key==="ArrowRight"){window.__m="keyboard";vote("like")}
 else if(e.key==="ArrowLeft"){window.__m="keyboard";vote("dislike")}
 else if(e.key==="ArrowDown"&&!S.detail)openDetail();
 else if(e.key==="z"||e.key==="Z")undo();
});
function bindDrag(){
 const el=document.getElementById("front");if(!el)return;let d=null;
 const reset=()=>{el.style.transition="transform 240ms cubic-bezier(.2,.7,.3,1)";el.style.transform="translate3d(0,0,0) rotate(0deg)";el.style.setProperty("--p","0")};
 el.addEventListener("pointerdown",e=>{if(S.busy||S.tutorial||(e.pointerType==="mouse"&&e.button!==0))return;d={x:e.clientX,y:e.clientY,t:performance.now()};el.setPointerCapture(e.pointerId);el.style.transition="none"});
 el.addEventListener("pointermove",e=>{if(!d)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;el.style.transform=`translate3d(${dx}px,${dy*.18}px,0) rotate(${dx/22}deg)`;el.style.setProperty("--p",Math.max(-1,Math.min(1,dx/110)))});
 el.addEventListener("pointerup",e=>{if(!d)return;const dx=e.clientX-d.x,dy=e.clientY-d.y,dt=Math.max(1,performance.now()-d.t);d=null;
  const far=Math.abs(dx)>Math.min(110,el.offsetWidth*.28),flick=Math.abs(dx)>40&&Math.abs(dx)/dt>.6;
  if(Math.abs(dx)<8&&Math.abs(dy)<8&&dt<600){reset();openDetail();return}
  if((far||flick)&&Math.abs(dx)>Math.abs(dy)){window.__m="swipe";vote(dx>0?"like":"dislike");return}
  if(dy<-80&&Math.abs(dy)>Math.abs(dx)){reset();openDetail();return}
  reset()});
 el.addEventListener("pointercancel",()=>{if(d){d=null;reset()}});
 const st=document.getElementById("stage");if(st)st.addEventListener("wheel",e=>{if(e.deltaY>25)openDetail()},{passive:true});
}
render();track("deck_loaded",{value:S.cards.length});if(S.remaining[0])track("card_view",{project_id:S.remaining[0].id,position:0});
</script>
</body>
</html>
